<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="monospace, sans-serif">
  <!-- Background -->
  <rect width="780" height="340" fill="#0f1117" rx="10"/>

  <!-- Title -->
  <text x="390" y="34" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="bold">CalculatorLibrary — Architecture</text>

  <!-- Test layer -->
  <rect x="30" y="60" width="200" height="100" rx="8" fill="#1e2a3a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="130" y="85" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">Unit Tests</text>
  <text x="130" y="105" text-anchor="middle" fill="#64748b" font-size="11">test_calculator.py</text>
  <text x="130" y="122" text-anchor="middle" fill="#64748b" font-size="11">16 test cases</text>
  <text x="130" y="139" text-anchor="middle" fill="#64748b" font-size="11">pytest + coverage</text>

  <rect x="30" y="180" width="200" height="100" rx="8" fill="#1e2a3a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="130" y="205" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">Integration Tests</text>
  <text x="130" y="225" text-anchor="middle" fill="#64748b" font-size="11">test_main.py</text>
  <text x="130" y="242" text-anchor="middle" fill="#64748b" font-size="11">17 test cases</text>
  <text x="130" y="259" text-anchor="middle" fill="#64748b" font-size="11">FastAPI TestClient</text>

  <!-- Arrows from tests -->
  <line x1="230" y1="110" x2="290" y2="160" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="230" y1="230" x2="290" y2="230" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Library layer -->
  <rect x="290" y="130" width="200" height="100" rx="8" fill="#1a2e1a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="390" y="155" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold">calculator.py</text>
  <text x="390" y="175" text-anchor="middle" fill="#64748b" font-size="11">add · subtract · multiply</text>
  <text x="390" y="192" text-anchor="middle" fill="#64748b" font-size="11">divide · power · sqrt</text>
  <text x="390" y="209" text-anchor="middle" fill="#64748b" font-size="11">mod · itob</text>

  <!-- Arrow from library to API -->
  <line x1="490" y1="180" x2="550" y2="180" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- API layer -->
  <rect x="550" y="130" width="200" height="100" rx="8" fill="#2a1e0a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="650" y="155" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="bold">main.py — FastAPI</text>
  <text x="650" y="175" text-anchor="middle" fill="#64748b" font-size="11">GET /add/{a}/{b}</text>
  <text x="650" y="192" text-anchor="middle" fill="#64748b" font-size="11">GET /divide/{a}/{b}</text>
  <text x="650" y="209" text-anchor="middle" fill="#64748b" font-size="11">port 8000 · uvicorn</text>

  <!-- Coverage bar at bottom -->
  <rect x="30" y="305" width="720" height="24" rx="6" fill="#1e2533"/>
  <rect x="30" y="305" width="669" height="24" rx="6" fill="#22c55e" opacity="0.7"/>
  <text x="390" y="321" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Coverage: 93–100% per file · 90% minimum enforced</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
  </defs>
</svg>
