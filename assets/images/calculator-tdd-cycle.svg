<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="monospace, sans-serif">
  <!-- Background -->
  <rect width="680" height="320" fill="#0f1117" rx="10"/>

  <!-- Title -->
  <text x="340" y="32" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="bold">Test-Driven Development Cycle</text>

  <!-- Circle nodes -->
  <!-- 1: Write failing test -->
  <circle cx="170" cy="140" r="62" fill="#1e2a3a" stroke="#ef4444" stroke-width="2"/>
  <text x="170" y="132" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="bold">Write</text>
  <text x="170" y="148" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="bold">failing test</text>
  <text x="170" y="166" text-anchor="middle" fill="#64748b" font-size="10">pytest → RED</text>

  <!-- 2: Write code -->
  <circle cx="340" cy="230" r="62" fill="#1a2e1a" stroke="#22c55e" stroke-width="2"/>
  <text x="340" y="222" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold">Write minimum</text>
  <text x="340" y="238" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold">code to pass</text>
  <text x="340" y="256" text-anchor="middle" fill="#64748b" font-size="10">pytest → GREEN</text>

  <!-- 3: Refactor -->
  <circle cx="510" cy="140" r="62" fill="#2a1e3a" stroke="#a78bfa" stroke-width="2"/>
  <text x="510" y="132" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold">Refactor</text>
  <text x="510" y="148" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold">&amp; clean up</text>
  <text x="510" y="166" text-anchor="middle" fill="#64748b" font-size="10">tests still GREEN</text>

  <!-- Arrows between nodes -->
  <!-- 1 → 2 -->
  <path d="M220,175 Q270,220 285,220" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arr-red)"/>
  <!-- 2 → 3 -->
  <path d="M395,220 Q445,200 462,175" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <!-- 3 → 1 (back around top) -->
  <path d="M460,100 Q340,30 220,100" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arr-purple)"/>

  <!-- Coverage badge -->
  <rect x="260" y="58" width="160" height="36" rx="8" fill="#1e2533" stroke="#3b82f6" stroke-width="1"/>
  <text x="340" y="74" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">Coverage gate</text>
  <text x="340" y="88" text-anchor="middle" fill="#64748b" font-size="10">85% per file · 90% overall</text>

  <!-- Labels on arrows -->
  <text x="240" y="215" fill="#94a3b8" font-size="10">test first</text>
  <text x="426" y="215" fill="#94a3b8" font-size="10">make pass</text>
  <text x="310" y="48" fill="#94a3b8" font-size="10">repeat</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a78bfa"/>
    </marker>
  </defs>
</svg>
